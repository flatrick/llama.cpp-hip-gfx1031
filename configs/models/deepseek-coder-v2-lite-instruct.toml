name = "DeepSeek Coder V2 Lite Instruct IQ4_XS"
hf = "bartowski/DeepSeek-Coder-V2-Lite-Instruct-GGUF:IQ4_XS"

[settings]
ctx_size = 163840
batch_size = 1024
ubatch_size = 256
n_gpu_layers = -1
parallel = 1
flash_attn = "on"
no_mmproj = true
jinja = true
cram = 2048
top_k = 20
top_p = 0.8
temp = 0.7
presence_penalty = 1.5
reasoning = "auto"
no_prefill_assistant = true
min_p = 0.0
repeat_penalty = 1.0

[backends.rocm]
ctx_size = 131072
cache_type_k = "f16"
cache_type_v = "f16"

[backends.vulkan]
cache_type_k = "q8_0"
cache_type_v = "q8_0"
